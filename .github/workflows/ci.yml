name: Tests & Code Quality CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Zootech & Veterinary Unit Tests
        run: npm test

      - name: Verify Cloudflare Pages Bundle Build
        run: npx wrangler pages functions build
