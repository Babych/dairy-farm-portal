name: Tests & Deploy CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run Unit Tests (Pure Zootech & WebCrypto Security)
        run: npm test

      - name: Verify Cloudflare Pages Bundle Build
        run: npx wrangler pages functions build

      - name: Run Live Health Check (Non-blocking on D1 Free Limits)
        run: node test_health_check.js

  deploy-to-cloudflare:
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Deploy to Cloudflare Pages via GitHub Actions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Deploying via Cloudflare API Token..."
            npx wrangler pages deploy . --project-name=dairy-farm-portal --branch=main
          else
            echo "CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID secret is not set yet in GitHub Secrets."
            echo "Build & Test passed successfully! Add secrets to enable automatic cloud deployment."
          fi
